name: IndexNow

on:
  push:
    branches: [master]
    paths:
      - 'src/content/problems/**'
  workflow_dispatch:
    inputs:
      urls:
        description: '직접 제출할 URL (공백 또는 줄바꿈 구분)'
        required: false
        default: ''
      full:
        description: '전체 문항 URL 제출 (초기 색인·대규모 개편용)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: indexnow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 제출할 URL 계산
        id: collect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          INPUT_URLS: ${{ github.event.inputs.urls }}
          INPUT_FULL: ${{ github.event.inputs.full }}
        run: |
          set -euo pipefail
          : > urls.txt

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_FULL" = "true" ]; then
              node scripts/indexnow-changed.mjs --all --hub >> urls.txt
            else
              printf '%s\n' "$INPUT_URLS" | tr -s '[:space:]' '\n' | sed '/^$/d' >> urls.txt
            fi
          else
            BEFORE="$BEFORE_SHA"

            # force push·새 브랜치·첫 커밋이면 직전 커밋을 기준으로 사용
            if [ -z "$BEFORE" ] ||
               [ "$BEFORE" = "0000000000000000000000000000000000000000" ] ||
               ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              BEFORE="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi

            if [ -n "$BEFORE" ]; then
              node scripts/indexnow-changed.mjs "$BEFORE" "$AFTER_SHA" --hub >> urls.txt
            else
              echo "이전 커밋이 없어 변경 문항 감지를 건너뜁니다." >&2
            fi
          fi

          if [ -s urls.txt ]; then
            sort -u urls.txt -o urls.txt
          fi

          COUNT=$(grep -c . urls.txt || true)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "제출 대상 URL: ${COUNT}개"
          cat urls.txt

      # Cloudflare가 GitHub Actions 러너 IP에는 403을 반환해 /api/deploy.json 폴링이 불가능합니다.
      # Cloudflare Pages 빌드(약 2분) + 배포 여유를 고려해 고정으로 대기합니다.
      - name: 배포 반영 대기
        if: steps.collect.outputs.count != '0'
        run: sleep 300

      # 러너에서는 사이트 키 파일을 확인할 수 없어(Cloudflare 403) 생략합니다.
      # 키 파일은 public/<key>.txt 로 항상 배포되며 IndexNow가 직접 검증합니다.
      - name: IndexNow 제출
        if: steps.collect.outputs.count != '0'
        run: node scripts/indexnow.mjs --url-file=urls.txt --skip-key-check
